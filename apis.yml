aid: aella-credit
name: Aella Credit
description: >-
  Aella (Aella Credit) is a technology-driven microfinance bank licensed by the
  Central Bank of Nigeria (CBN), building consumer and business financial
  infrastructure across Africa. Its consumer app offers savings, low-interest
  and same-day loans, bill payments, and high-yield savings accounts, while its
  Fintech-as-a-Service platform exposes that infrastructure to businesses through
  a developer-facing API gateway. Published API capabilities include wallet-as-a-
  service (create and manage digital wallets with real-time balances and full
  ledger support), KYC/identity verification via BVN and NIN, bank-account lookup
  and validation, sub-accounts and pooled fund structures for platforms and
  marketplaces, and direct-debit recurring collections. A live Aella Merchant API
  is hosted at api.aellaapp.com and a merchant dashboard at merchant.aellaapp.com,
  though the provider does not yet publish a public developer portal, OpenAPI
  definition, or SDKs. This profile was seeded as a portfolio company of 500 Global
  and enriched by the API Evangelist pipeline.
